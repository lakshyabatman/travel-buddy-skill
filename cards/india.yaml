# cards.yaml - Indian credit-card points -> airline/hotel transfer table
#
# READ THIS FIRST
# - Ratios are written "card points : partner points". "2:1" = 2 card points give 1 mile.
#   "1:2" = 1 card point gives 2 miles. points_needed = ceil(award_miles * a / b) for ratio "a:b".
# - verified: true  -> the number was read on an OFFICIAL page (the bank/issuer, or the
#                      partner programme's own page about this bank) on last_checked.
#   verified: false -> only found on blogs/aggregators, or the official page is old or behind a
#                      login. Treat as a lead, NOT a fact. Confirm in the bank portal before moving points.
# - Banks add and drop partners without notice (2024-2026 saw several overnight removals and
#   ratio cuts). If last_checked is more than ~60 days old, re-verify before relying on it.
# - null = we could not find it. Never fill a null with a guess.
# - Transfers are almost always IRREVERSIBLE. Check award space on the partner site first.
#
# See CONTRIBUTING.md for how to add or refresh a card batch.

schema_version: 1
country: India
country_code: IN
table_last_checked: 2026-11-25
currency_note: "Caps and fees in INR. 1,50,000 = 150,000 (Indian digit grouping)."

