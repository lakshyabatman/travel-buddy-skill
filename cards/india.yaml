        - https://www.hdfc.bank.in/content/dam/hdfcbankpws/in/en/personal-banking/discover-products/cards/credit-cards/diners-club-black-metal-edition-credit-card/diners6.pdf
        - https://offers.reward360.in/miles_transfer/bonus_offer
    fees: "Rs 99 + tax redemption fee waived for Diners Black (HDFC redemption form)."
    fees_verified: true
    alt_redemption: "SmartBuy flights/hotels at Rs 1 per RP, up to 70% of booking value."
    notes: "Reward points valid 3 years from accrual (diners6.pdf). Diners acceptance abroad is patchy, but transfers are unaffected."
    source_url: https://www.hdfc.bank.in/credit-cards/diners-club-black-metal-edition-credit-card
    last_checked: 2026-11-25
    verified: true

  - id: axis_atlas
    name: Axis Bank Atlas
    program: axis_edge_miles
    caps:
      annual_total: "1,50,000 EDGE Miles per customer ID per calendar year"
      annual_group_a: "30,000 EDGE Miles (shared by ALL Group A partners)"
      annual_group_b: "1,20,000 EDGE Miles (shared by ALL Group B partners)"
      multi_card_rule: "Atlas + Reserve: caps add up. Atlas + Olympus (both EDGE Miles): the higher Olympus cap applies to both combined."
      verified: true
    fees:
      value: null
      note: "No transfer fee in Axis's official transfer T&Cs. One aggregator reports Rs 199 + GST per transfer (https://travelwith.cc/transfers/to/asia-miles) - unverified; check the portal."
