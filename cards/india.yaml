cards:

  - id: hdfc_infinia
    name: HDFC Bank Infinia / Infinia Metal Edition
    program: hdfc_reward_points
    ratio_note: "Partner ratios as in programs.hdfc_reward_points (best HDFC tier)."
    caps:
      monthly: "1,50,000 RP per calendar month, shared across SmartBuy flights, hotels and airmiles transfers"
      monthly_verified: true
      redemptions_per_month: "Max 5 redemptions per month from 1 Feb 2026 (reported by Business Standard citing HDFC's website; not found on an HDFC page by us)"
      redemptions_per_month_verified: false
      redemptions_per_month_source: https://www.business-standard.com/finance/personal-finance/hdfc-bank-changes-terms-for-infinia-card-customers-what-to-expect-126013000728_1.html
    fees: "Rs 99 + tax redemption fee is waived for Infinia (HDFC redemption form). SmartBuy transfer fee: none stated (unverified)."
    fees_verified: true
    alt_redemption: "SmartBuy flights/hotels at Rs 1 per RP (up to 70% of booking value) - compare against transfers."
    notes: "Points lapse if the card is unused for 365 days (Business Standard). Invite-only card."
    source_url: https://www.hdfc.bank.in/credit-cards/infinia-credit-card
    last_checked: 2026-11-25
    verified: true   # caps and core terms verified; see each partner for ratio status

  - id: hdfc_diners_black
    name: HDFC Bank Diners Club Black / Diners Club Black Metal Edition
    program: hdfc_reward_points
    ratio_note: "Same partner ratios as Infinia (HDFC Air India and Cathay pages list both cards at 2:1)."
    caps:
      monthly: "75,000 RP per calendar month for SmartBuy flights, hotels and airmiles transfer"
      monthly_verified: true
