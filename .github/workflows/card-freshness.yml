name: Card freshness

on:
  schedule:
    # Mondays 06:00 UTC. Runs on the default branch, not on pull request code.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  # checkout needs contents: read. issues: write is the only write this job has.
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build the report
        run: python scripts/card_freshness_report.py > "$RUNNER_TEMP/card-report.md"
      - name: Open or update the issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.RUNNER_TEMP + '/card-report.md', 'utf8').slice(0, 60000);
            const title = 'Card data: stale or unverified entries';
            const statusLine = body.split(/\r?\n/, 1)[0].trim();
            const clean = statusLine === 'status: clean';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (clean) {
              if (existing) {
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, body, state: 'closed',
                });
              }
              return;
            }
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, body,
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: 'Updated by the weekly card-freshness workflow.',
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
