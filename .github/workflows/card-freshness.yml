name: Card freshness

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Build the report
        run: python scripts/card_freshness_report.py > "$RUNNER_TEMP/card-report.md"
      - name: Open or update the issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.RUNNER_TEMP + '/card-report.md', 'utf8').slice(0, 60000);
            const title = 'Card data: stale or unverified entries';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            const clean = body.includes('Nothing stale or unverified.');
            if (clean) {
              if (existing) {
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, body, state: 'closed',
                });
              }
              return;
            }
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, body,
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: 'Updated by the weekly card-freshness workflow.',
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
