name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate card files and airline fee snapshots
        run: python scripts/validate_cards.py
      - name: Check docs coverage table is current
        run: python scripts/build_docs.py --check
      - name: Unit tests and eval file
        run: |
          python -m unittest discover -s tests -t . -q
          python evals/run.py --check
      - name: search.py CLI smoke
        run: python search.py --help
      - name: Live Google Flights smoke test
        # The unofficial scraper can be blocked or break; do not fail the whole CI on that.
        # DATE is computed locally. Do not interpolate GitHub event fields into this script.
        continue-on-error: true
        run: |
          DATE=$(python -c "from datetime import date,timedelta; print((date.today()+timedelta(days=21)).isoformat())")
          python search.py LHR JFK "$DATE" --currency GBP --top 3 --no-history
