# Award-search links. A template is not availability.
# Placeholders: {origin} {destination} {depart} {adults}
# Dates are YYYY-MM-DD. IATA codes are uppercase.
# verified true means the URL shape was opened from this environment on last_checked.
# verified false means the shape was not re-fetched here. Do not claim the seat exists.
schema_version: 1
last_checked: "2026-11-25"
checklist:
  - Open the link and confirm it is the award (miles) search, not a cash fare.
  - Look for saver or the cheapest award bucket, not only a standard or flex award.
  - Read the taxes and carrier surcharges in cash, not just the mileage price.
  - Check the cabin on every segment. A mixed-cabin trip is not the cabin you asked for unless you accept it.
  - If the site asks you to log in before showing space, the seat was not checked.
programmes:
  - id: aeroplan
    name: Air Canada Aeroplan
    supports_prefill: true
    round_trip_prefill: false
    template: "https://www.aircanada.com/aeroplan/redeem/availability/outbound?tripType=O&org0={origin}&dest0={destination}&departureDate0={depart}&ADT={adults}&YTH=0&CHD=0&INF=0&INS=0&lang=en-CA"
    search_url: "https://www.aircanada.com/aeroplan/redeem/availability/outbound"
    cabin_in_url: false
    login_required_to_open: false
    limits: "One-way only. Cabin is chosen on the page, not in the URL. A 200 response does not mean a seat is available. Return trips need a second search."
    source_url: "https://www.aircanada.com/aeroplan/redeem/availability/outbound?tripType=O&org0=YUL&dest0=LHR&departureDate0=2026-12-16&ADT=1&YTH=0&CHD=0&INF=0&INS=0&lang=en-CA"
